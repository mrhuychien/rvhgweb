name: Soát link chết

# Build thật rồi đối chiếu mọi href/src nội bộ với route + asset có trong
# dist, cộng redirect trong vercel.json. Chặn ngay kiểu link
# /san-pham/<slug>/index.html — trông đúng nhưng không khớp redirect nào và
# cũng không có route Astro, nên trả 404 (đã từng có 29 link như vậy).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` tự sinh biến thể ảnh WebP trước khi gọi astro build.
      - run: pnpm build

      - run: node tools/linkcheck.mjs

      - run: node tools/linkcheck.mjs --platform vercel

      - run: node tools/pages-check.mjs

      - name: Verify Cloudflare Pages HTTP behavior
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm pages:preview > /tmp/rvhg-pages-preview.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8788/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm pages:smoke
