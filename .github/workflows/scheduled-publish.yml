name: Đăng bài theo lịch

# Rebuild to publish posts whose publishDate has arrived (src/lib/posts.ts).
# Add CLOUDFLARE_PAGES_DEPLOY_HOOK after the Pages project is connected to Git.
# Keep VERCEL_DEPLOY_HOOK during migration so the rollback site stays current.
# Hook URLs are credentials: enter them directly in GitHub Actions secrets.
# Scheduled runs only use the workflow on the default branch.
on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 07:00 Vietnam time
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Cloudflare Pages
            secret: CLOUDFLARE_PAGES_DEPLOY_HOOK
          - provider: Vercel
            secret: VERCEL_DEPLOY_HOOK
    name: Rebuild ${{ matrix.provider }}
    steps:
      - name: Trigger configured deploy hook
        env:
          HOOK: ${{ secrets[matrix.secret] }}
          PROVIDER: ${{ matrix.provider }}
          SECRET_NAME: ${{ matrix.secret }}
        shell: bash
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::$SECRET_NAME is not configured; skipping $PROVIDER rebuild."
            exit 0
          fi
          # Do not print the hook URL, response body, or curl error text.
          if ! code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 60 --request POST "$HOOK"); then
            echo "::error::$PROVIDER deploy hook request failed."
            exit 1
          fi
          case "$code" in
            2*) echo "$PROVIDER rebuild requested (HTTP $code). Check the deployment result in its dashboard." ;;
            *) echo "::error::$PROVIDER deploy hook failed (HTTP $code)."; exit 1 ;;
          esac
